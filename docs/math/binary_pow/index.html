  <header>
    <h1>binary pow</h1>
  </header>

<pre><code><span class="kw">int</span> <span class="fn">pow</span>(<span class="kw">int</span> a, <span class="kw">int</span> n) {
    <span class="kw">int</span> res = <span class="num">1</span>;
    <span class="kw">while</span> (n &gt; <span class="num">0</span>) {
        <span class="kw">if</span> (n % <span class="num">2</span> == <span class="num">1</span>)
            res *= a;
        a *= a;
        n /= <span class="num">2</span>;
    }

    <span class="kw">return</span> res;
}</code></pre>
