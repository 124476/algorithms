    <h1>lcm</h1>
  </header>

<pre><code><span class="cmt">// НОК — наименьшее общее кратное.
// lcm(a, b) = a / gcd(a, b) * b</span>

<span class="kw">int</span> <span class="fn">gcd</span>(<span class="kw">int</span> a, <span class="kw">int</span> b) {
    <span class="kw">while</span> (b) {
        a %= b;
        swap(a, b);
    }
    <span class="kw">return</span> a;
}

<span class="kw">int</span> <span class="fn">lcm</span>(<span class="kw">int</span> a, <span class="kw">int</span> b) {
    <span class="kw">return</span> a / <span class="fn">gcd</span>(a, b) * b;
}</code></pre>
