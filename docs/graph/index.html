<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>graph</title>
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg" />
  <style>
    :root {
      --bg: #0d1117;
      --panel: #161b22;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #58a6ff;
    }
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      max-width: 960px;
      margin: 0 auto;
      padding: 2rem 1rem 4rem;
      line-height: 1.6;
      background: var(--bg);
      color: var(--text);
    }
    a { color: var(--accent); text-decoration: none; }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: .35rem;
      padding: .4rem .8rem;
      margin-bottom: 2rem;
      font-size: .9rem;
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 8px;
      transition: all .15s ease;
    }
    .back-link:hover {
      color: var(--text);
      border-color: var(--accent);
      background: var(--panel);
    }

    header {
      margin-bottom: 2.5rem;
      text-align: center;
    }
    header h1 {
      font-size: clamp(1.8rem, 4vw, 2.5rem);
      margin: 0 0 .5rem;
    }
    header p {
      color: var(--muted);
      margin: 0;
      font-size: 1.05rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.25rem;
    }
    .card {
      display: flex;
      flex-direction: column;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      text-decoration: none;
      color: inherit;
      transition: transform .15s ease, border-color .15s ease, box-shadow .15s ease;
    }
    .card:hover {
      transform: translateY(-4px);
      border-color: var(--accent);
      box-shadow: 0 8px 24px rgba(88, 166, 255, .1);
    }
    .card h2 {
      margin: 0 0 .5rem;
      font-size: 1.25rem;
      color: var(--accent);
    }
    .card p {
      margin: 0;
      font-size: .9rem;
      color: var(--muted);
      flex-grow: 1;
    }
    .card .meta {
      margin-top: 1.25rem;
      padding-top: .75rem;
      border-top: 1px solid var(--border);
      font-size: .8rem;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
    }
  </style>
</head>
<body>
  <a class="back-link" href="../../index.html">back</a>

  <header>
    <h1>graph</h1>
  </header>

  <main class="grid">
    <a class="card" href="./dfs/index.html">
      <h2>dfs</h2>
    </a>
    <a class="card" href="./bfs/index.html">
      <h2>bfs</h2>
    </a>
  </main>
</body>
</html>
