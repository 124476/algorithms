<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>dfs</title>
  <link rel="icon" type="image/svg+xml" href="../../../favicon.svg" />
  <style>
    :root {
      --bg: #0d1117;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #58a6ff;
      --code-bg: #0b0f14;
    }
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      max-width: 960px;
      margin: 0 auto;
      padding: 2rem 1rem 4rem;
      line-height: 1.6;
      background: var(--bg);
      color: var(--text);
    }
    a { color: var(--accent); text-decoration: none; }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: .35rem;
      padding: .4rem .8rem;
      margin-bottom: 2rem;
      font-size: .9rem;
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 8px;
      transition: all .15s ease;
    }
    .back-link:hover {
      color: var(--text);
      border-color: var(--accent);
      background: #161b22;
    }

    header {
      margin-bottom: 2.5rem;
      text-align: center;
    }
    header h1 {
      font-size: clamp(1.8rem, 4vw, 2.5rem);
      margin: 0 0 .5rem;
    }

    pre {
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem 1.25rem;
      overflow-x: auto;
      font-size: .85rem;
      line-height: 1.5;
      margin: 0;
    }
    pre code {
      font-family: ui-monospace, "SF Mono", Consolas, monospace;
      color: var(--text);
    }
    .kw { color: #ff7b72; }
    .str { color: #a5d6ff; }
    .fn { color: #d2a8ff; }
  </style>
</head>
<body>
  <a class="back-link" href="../index.html">back</a>

  <header>
    <h1>dfs</h1>
  </header>

  <pre><code><span class="kw">void</span> <span class="fn">dfs</span>(<span class="kw">int</span> v, <span class="kw">const</span> vector&lt;vector&lt;<span class="kw">int</span>&gt;&gt;&amp; graph, vector&lt;<span class="kw">bool</span>&gt;&amp; visited) {
      visited[v] = <span class="kw">true</span>;
      cout &lt;&lt; v &lt;&lt; <span class="str">" "</span>;

      <span class="kw">for</span> (<span class="kw">int</span> neighbor : graph[v]) {
          <span class="kw">if</span> (!visited[neighbor]) {
              <span class="fn">dfs</span>(neighbor, graph, visited);
          }
      }
  }</code></pre>

</body>
</html>
